org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程位于含中文的目录下，AGP 默认会直接拒绝构建。
# 现代 AGP + JDK17 在 UTF-8 文件系统上实际可用，这里显式放行。
android.overridePathCheck=true

kotlin.code.style=official

# Kotlin 编译守护进程要通过本地 socket 与 Gradle 握手；在受限/沙箱环境里这个通道
# 会被拦掉（Could not connect to Kotlin compile daemon）。改成在 Gradle 进程内编译，
# 单模块工程代价很小，换来的是任何环境都能直接 assemble。
kotlin.compiler.execution.strategy=in-process
